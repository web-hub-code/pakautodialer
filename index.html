<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Calling Web Dialer</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f6f9;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
        }
        .section {
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: vertical;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219150;
        }
        .call-card {
            border: 2px solid #e0e0e0;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            background: #fafafa;
        }
        .call-card h3 {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .call-card p {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 15px;
        }
        .dial-btn {
            display: inline-block;
            background-color: #2980b9;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .status-btns {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .status-btns button {
            font-size: 14px;
            padding: 10px;
        }
        .btn-interested { background-color: #27ae60; }
        .btn-callback { background-color: #f39c12; }
        .btn-not { background-color: #c0392b; }
        .btn-interested:hover { background-color: #1e8449; }
        .btn-callback:hover { background-color: #d68910; }
        .btn-not:hover { background-color: #922b21; }
        .hidden { display: none; }
        .stats {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cold Calling Auto-Dialer</h2>

    <!-- Step 1: Import Contacts -->
    <div id="import-section" class="section">
        <label style="font-weight: bold; display: block; margin-bottom: 8px;">Paste CSV Data (Format: Name, Phone Number):</label>
        <textarea id="csvInput" placeholder="Nomad Travels, 03390037475&#10;Lubna's kitchen, 03354479569"></textarea>
        <button onclick="loadContacts()" style="margin-top: 10px;">Load Contacts</button>
    </div>

    <!-- Step 2: Call Interface -->
    <div id="dialer-section" class="section hidden">
        <div class="call-card">
            <h3 id="contactName">Business Name</h3>
            <p id="contactPhone">03000000000</p>
            
            <a id="callLink" href="#" class="dial-btn" onclick="markCalled()">📞 Call Now</a>

            <div class="status-btns">
                <button class="btn-interested" onclick="nextContact('Interested')">Interested</button>
                <button class="btn-callback" onclick="nextContact('Call Back')">Call Back</button>
                <button class="btn-not" onclick="nextContact('Not Interested')">Not Interested</button>
            </div>
        </div>
        <div class="stats" id="statsText">Contact 1 of X</div>
    </div>
</div>

<script>
    let contacts = [];
    let currentIndex = 0;
    let results = [];

    function loadContacts() {
        const text = document.getElementById('csvInput').value.trim();
        if (!text) {
            alert('Please paste some contacts first!');
            return;
        }

        const lines = text.split('\n');
        contacts = lines.map(line => {
            const parts = line.split(',');
            return {
                name: parts[0] ? parts[0].trim() : 'Unknown',
                phone: parts[1] ? parts[1].trim() : (parts[0] ? parts[0].trim() : '')
            };
        }).filter(c => c.phone.length > 0);

        if (contacts.length === 0) {
            alert('No valid contacts found!');
            return;
        }

        currentIndex = 0;
        results = [];
        document.getElementById('import-section').classList.add('hidden');
        document.getElementById('dialer-section').classList.remove('hidden');
        showContact();
    }

    function showContact() {
        if (currentIndex < contacts.length) {
            const c = contacts[currentIndex];
            document.getElementById('contactName').innerText = c.name;
            document.getElementById('contactPhone').innerText = c.phone;
            document.getElementById('callLink').href = "tel:" + c.phone;
            document.getElementById('statsText').innerText = `Contact ${currentIndex + 1} of ${contacts.length}`;
        } else {
            alert('Calling completed for all contacts!');
            console.log('Final Results:', results);
            location.reload();
        }
    }

    function markCalled() {
        console.log('Calling:', contacts[currentIndex].phone);
    }

    function nextContact(status) {
        results.push({
            name: contacts[currentIndex].name,
            phone: contacts[currentIndex].phone,
            status: status
        });
        currentIndex++;
        showContact();
    }
</script>

</body>
</html>
